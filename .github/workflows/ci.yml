name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests + Debug/Release build
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Echoed so a runner-image bump that changes the toolchain is obvious in
      # the log rather than showing up as a mystery compile error.
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      # The same gate developers run locally — deliberately invoked as a script
      # rather than restated here, so CI and `verify-local.sh` cannot drift.
      # The script uses unsigned builds.
      - name: Verify
        run: ./scripts/verify-local.sh
