name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    # The Xcode 27 image (macOS 27) is a public preview on GitHub. Move to the macOS 27 image
    # when it is generally available.
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # One pinned Xcode, so CI does not change compiler or formatter when the runner image
      # changes. docs/development.md names the same version; change both together.
      - name: Select Xcode
        id: xcode
        env:
          XCODE_APP: /Applications/Xcode_27.0.app
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
          swift --version
          sw_vers
          xcode="$(xcodebuild -version | awk 'NR == 1 { v = $2 } NR == 2 { print v "-" $3 }')"
          echo "cache_prefix=swift-$RUNNER_OS-$RUNNER_ARCH-xcode-$xcode" >> "$GITHUB_OUTPUT"

      # Only the resolved Sparkle package is worth caching. A fresh checkout gives every
      # source a new timestamp, so a cached .build would be recompiled anyway.
      - name: Cache the Sparkle package
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: ${{ steps.xcode.outputs.cache_prefix }}-${{ hashFiles('ClaudeMeter.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: make check
        run: make check
